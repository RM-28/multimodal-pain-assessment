[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painnet"
version = "0.1.0"
description = "Multimodal pain assessment from EEG + wristband physiological signals (PSU AI 570 team project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jonathan Miller" },
    { name = "Meng Li" },
    { name = "Raj Mamidala" },
]

# Deliberately thin. Kaggle's notebook image already ships tensorflow, keras,
# numpy, pandas, scikit-learn, matplotlib and seaborn -- pinning them here
# would trigger a slow reinstall and risk clobbering the working CUDA build.
# Only list what Kaggle does NOT already have.
dependencies = [
    "openpyxl>=3.1",   # needed to read the survey .xlsx (labels live there)
]

[project.optional-dependencies]
# For a local machine that is starting from nothing.
local = [
    "tensorflow>=2.16",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter",
]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q because the leakage guard is meant to be run constantly, not admired
addopts = "-q"
